name: Bug report
description: Something in Watchcat is not working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Remove server keys, tokens, and real players' usernames or IDs** from everything you paste.
        For security vulnerabilities, follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Watchcat version or commit
      placeholder: e.g. v0.1.0 or a1b2c3d
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Docker on Ubuntu 24.04, Python 3.12
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and player identifiers before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all secrets and real player identifiers from this report.
          required: true
